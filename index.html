<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Page Not Found</title>

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
    }

    h1 {
        font-size: 100px;
        margin: 0;
    }

    p {
        font-size: 20px;
        margin: 15px 0;
    }

    .funny {
        font-size: 16px;
        opacity: 0.8;
        margin-bottom: 25px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #ff6b6b;
        color: white;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }

    button:hover {
        background: #ff4b4b;
        transform: scale(1.05);
    }

    #joke {
        margin-top: 20px;
        font-style: italic;
        opacity: 0.9;
    }
</style>
</head>

<body>

<div class="container">
    <h1>404</h1>
    <p>Oops! This page wandered off.</p>
    <p class="funny">Maybe it joined a startup and pivoted?</p>

    <button id="jokeBtn">Tell me a joke</button>

    <p id="joke"></p>
</div>

<script>
    const jokes = [ // Array of funny messages
        "We looked everywhere... even under the couch.",
        "This page is on vacation. No return date.",
        "Error 404: Page went to get milk and never came back.",
        "The page you want is in another castle.",
        "Looks like this page rage-quit.",
        "404: Page not found. But hey, you found this message!"
    ];

    const jokeBtn = document.getElementById('jokeBtn'); // Get button
    const jokeText = document.getElementById('joke'); // Get joke paragraph

    jokeBtn.addEventListener('click', function() { // Add click event
        const randomIndex = Math.floor(Math.random() * jokes.length); // Pick random joke
        jokeText.textContent = jokes[randomIndex]; // Display joke
    });
</script>

</body>
</html>
